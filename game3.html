<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#101827,#263b5c);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.game{
    width:100%;
    max-width:800px;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

h1{
    text-align:center;
    font-size:35px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    opacity:.8;
    margin-bottom:25px;
}

.center{
    text-align:center;
}

.emoji{
    font-size:70px;
    margin-bottom:10px;
}

.startBtn,
.restartBtn{
    margin-top:25px;
    padding:15px 35px;
    border:none;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:white;
    color:#17243a;
    transition:.2s;
}

.startBtn:hover,
.restartBtn:hover{
    transform:scale(1.05);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    font-weight:bold;
}

.timerBox{
    padding:10px 18px;
    border-radius:30px;
    background:rgba(255,255,255,.12);
}

.timer{
    font-size:20px;
}

.progress{
    width:100%;
    height:8px;
    background:rgba(255,255,255,.15);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progressBar{
    height:100%;
    width:0%;
    background:white;
    transition:.3s;
}

.category{
    display:inline-block;
    padding:7px 14px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    font-size:13px;
    margin-bottom:12px;
}

.question{
    font-size:23px;
    line-height:1.5;
    font-weight:bold;
    background:rgba(255,255,255,.09);
    padding:22px;
    border-radius:18px;
    margin-bottom:20px;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.option{
    padding:17px;
    border-radius:15px;
    border:2px solid rgba(255,255,255,.20);
    background:rgba(255,255,255,.08);
    color:white;
    font-size:17px;
    text-align:left;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    background:rgba(255,255,255,.18);
    transform:translateY(-2px);
}

.option.correct{
    background:#16803a;
    border-color:#62ff91;
}

.option.wrong{
    background:#a51d30;
    border-color:#ff6575;
}

.option.disabled{
    pointer-events:none;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-top:22px;
    font-weight:bold;
}

.resultScore{
    font-size:60px;
    font-weight:bold;
    margin:20px 0;
}

.hidden{
    display:none;
}

.stats{
    margin-top:20px;
    line-height:2;
}

@media(max-width:600px){
    .game{
        padding:18px;
    }

    h1{
        font-size:28px;
    }

    .question{
        font-size:19px;
    }

    .options{
        grid-template-columns:1fr;
    }
}
</style>
</head>

/* =====================================================
   EXTRA 400+ AUTOMATICALLY VERIFIED MATH QUESTIONS
   ===================================================== */

for(let a=2;a<=31;a++){

    for(let b=2;b<=15;b++){

        let answer=a*b;

        questionBank.push({
            category:"गणित",
            q:`${a} × ${b} = ?`,
            o:[
                String(answer),
                String(answer+1),
                String(answer-1),
                String(answer+2)
            ],
            a:0
        });

        if(questionBank.length>=520) break;
    }

    if(questionBank.length>=520) break;
}


/* =====================================================
   RANDOMIZE OPTIONS
   ===================================================== */

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        let j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=
        [array[j],array[i]];
    }

    return array;
}


/* =====================================================
   GAME VARIABLES
   ===================================================== */

let gameQuestions=[];
let currentQuestion=0;
let score=0;
let lives=3;
let correctCount=0;
let timeLeft=15;
let timerInterval;


/* HIGH SCORE */

let highScore=
Number(localStorage.getItem("geniusHighScore") || 0);

document.getElementById("startHighScore").innerText=
highScore;


/* =====================================================
   START GAME
   ===================================================== */

function startGame(){

    clearInterval(timerInterval);

    currentQuestion=0;
    score=0;
    lives=3;
    correctCount=0;

    /*
       हर बार पूरे bank से
       नए 15 random questions
    */

    gameQuestions=
    shuffle([...questionBank])
    .slice(0,15);


    document.getElementById("startScreen")
    .classList.add("hidden");

    document.getElementById("resultScreen")
    .classList.add("hidden");

    document.getElementById("gameScreen")
    .classList.remove("hidden");


    document.getElementById("score").innerText=score;
    document.getElementById("lives").innerText=lives;

    showQuestion();
}


/* =====================================================
   SHOW QUESTION
   ===================================================== */

function showQuestion(){

    clearInterval(timerInterval);

    if(
        currentQuestion>=15 ||
        lives<=0
    ){

        endGame();
        return;
    }


    let data=
    JSON.parse(
        JSON.stringify(
            gameQuestions[currentQuestion]
        )
    );


    /* OPTIONS RANDOM */

    let correctAnswer=
    data.o[data.a];

    shuffle(data.o);

    data.a=
    data.o.indexOf(correctAnswer);


    gameQuestions[currentQuestion]=data;


    document.getElementById("questionNumber")
    .innerText=currentQuestion+1;

    document.getElementById("category")
    .innerText="📚 "+data.category;

    document.getElementById("question")
    .innerText=data.q;


    let options=
    document.getElementById("options");

    options.innerHTML="";


    data.o.forEach((option,index)=>{

        let button=
        document.createElement("button");

        button.className="option";

        button.innerText=
        String.fromCharCode(65+index)+". "+option;

        button.onclick=
        ()=>checkAnswer(index,button);

        options.appendChild(button);
    });


    document.getElementById("progressBar")
    .style.width=
    ((currentQuestion)/15*100)+"%";


    startTimer();
}


/* =====================================================
   TIMER
   ===================================================== */

function startTimer(){

    timeLeft=15;

    document.getElementById("timer")
    .innerText=timeLeft;


    timerInterval=
    setInterval(()=>{

        timeLeft--;

        document.getElementById("timer")
        .innerText=timeLeft;


        if(timeLeft<=0){

            clearInterval(timerInterval);

            timeUp();
        }

    },1000);
}


/* =====================================================
   LOCK OPTIONS
   ===================================================== */

function lockButtons(){

    document
    .querySelectorAll(".option")
    .forEach(button=>{

        button.classList.add("disabled");
    });
}


/* =====================================================
   CHECK ANSWER
   ===================================================== */

function checkAnswer(selected,button){

    clearInterval(timerInterval);

    lockButtons();


    let correct=
    gameQuestions[currentQuestion].a;

    let buttons=
    document.querySelectorAll(".option");


    if(selected===correct){

        button.classList.add("correct");

        /*
           सही जवाब पर
           100 + बचा हुआ time bonus
        */

        score+=100+(timeLeft*5);

        correctCount++;

        document.getElementById("score")
        .innerText=score;

    }else{

        button.classList.add("wrong");

        buttons[correct]
        .classList.add("correct");

        lives--;

        document.getElementById("lives")
        .innerText=lives;
    }


    setTimeout(()=>{

        currentQuestion++;

        showQuestion();

    },900);
}


/* =====================================================
   TIME UP
   ===================================================== */

function timeUp(){

    lockButtons();

    let correct=
    gameQuestions[currentQuestion].a;

    document
    .querySelectorAll(".option")[correct]
    .classList.add("correct");


    lives--;

    document.getElementById("lives")
    .innerText=lives;


    setTimeout(()=>{

        currentQuestion++;

        showQuestion();

    },900);
}


/* =====================================================
   END GAME
   ===================================================== */

function endGame(){

    clearInterval(timerInterval);


    document.getElementById("gameScreen")
    .classList.add("hidden");

    document.getElementById("resultScreen")
    .classList.remove("hidden");


    document.getElementById("finalScore")
    .innerText=score;

    document.getElementById("correctAnswers")
    .innerText=correctCount;


    if(score>highScore){

        highScore=score;

        localStorage.setItem(
            "geniusHighScore",
            highScore
        );

        document.getElementById("resultMessage")
        .innerText=
        "🎉 शानदार! आपने नया High Score बनाया!";

    }

    else if(correctCount>=13){

        document.getElementById("resultMessage")
        .innerText=
        "🔥 कमाल! आपकी knowledge बहुत अच्छी है!";

    }

    else if(correctCount>=9){

        document.getElementById("resultMessage")
        .innerText=
        "👏 बहुत अच्छा! थोड़ा और practice करें!";

    }

    else{

        document.getElementById("resultMessage")
        .innerText=
        "💪 फिर से खेलिए और अपना Score बढ़ाइए!";
    }


    document.getElementById("finalHighScore")
    .innerText=highScore;
}
